name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Swift version
        run: swift --version
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Version sync
        run: ./scripts/check-versions.sh

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install Vale
        env:
          VALE_VERSION: 3.17.0
        run: |
          set -euo pipefail
          curl -fsSL -o vale.tar.gz \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          tar -xzf vale.tar.gz vale
          sudo mv vale /usr/local/bin/vale
          vale --version
      - name: Prose lint
        run: vale README.md SECURITY.md CONTRIBUTING.md SUPPORT.md AGENTS.md

  # Aggregate job for branch protection. Require this one check.
  ci:
    needs: [test, prose]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All gates passed."
